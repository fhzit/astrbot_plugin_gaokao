name: astrbot_plugin_gaokao
display_name: 高考倒计时每日一言
short_desc: 每日推送高考倒计时与励志一言，支持本地句库/UAPIPro、分群配置与可选 LLM 审核。
desc: |-
  每日定时向指定群聊发送高考倒计时和励志一言。
  一言来源支持本地句库（内置 156 句高考励志语录，可在配置中追加）与 UAPIPro 接口二选一；
  UAPIPro 支持基础一言与随机/每日/场景/此刻接口、来源/分类/标签过滤、可选 API Key。
  支持按群独立配置（template_list 分群条目）与可选发布前 LLM 审核。
version: 1.2.0
author: HelloFHZ
repo: https://github.com/fhzit/astrbot_plugin_gaokao
astrbot_version: ">=4.5.7"
support_platforms:
  - aiocqhttp
  - telegram
  - discord
  - lark
  - dingtalk
  - wecom
  - kook
  - satori
